<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d5c5bc" />
    <title>03 · Melt · Codevember 2026</title>
    <meta name="description" content="Backlit generative berry popsicle slowly melting in real time — move or hold the pointer to warm the ice and speed up the melt." />
    <meta name="author" content="Theo Tillberg" />
    <!-- share image: 03/about/screengrab.png, copied next to the build by scripts/build.mjs -->
    <meta property="og:title" content="03 · Melt · Codevember 2026" />
    <meta property="og:description" content="Backlit generative berry popsicle slowly melting in real time." />
    <meta property="og:image" content="https://ttillberg.github.io/codevember-2026/03/screengrab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- the title plate (docs/DESIGN.md): put the word in Japanese in the span -->
    <div class="plate"><div class="head"><b>03 Melt</b><i><a class="home" href="https://ttillberg.github.io/codevember-2026/">Codevember 2026 <span lang="ja">融解</span></a> · <a class="home" href="https://x.com/theo_t">@theo_t</a></i></div></div>

    <nav id="preset-dock" class="preset-dock" aria-label="Popsicle presets"></nav>

    <div id="dev-dock" class="dev-dock" hidden>
      <div class="dev-dock-btns">
        <button id="btn-customize" class="pill-btn" type="button" title="Customize popsicle (C)" aria-label="Customize popsicle" aria-expanded="false" aria-controls="customize-panel">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 10a5 5 0 0 1 10 0v6a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 16v-6Z"></path>
            <path d="M12 17.5V22"></path>
            <path d="M10.2 9.5v4.5"></path>
            <path d="M13.8 9.5v4.5"></path>
          </svg>
          <span>Customize</span>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="Tune parameters" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
      <div id="customize-panel" class="customize-panel" hidden>
        <div class="cust-head">
          <b>Customize</b>
          <div class="cust-actions">
            <button id="btn-cust-random" class="mini-btn" type="button" title="Randomize combination">Surprise</button>
            <button id="btn-cust-reset" class="mini-btn" type="button" title="Restore classic berry mix">Reset</button>
          </div>
        </div>

        <div class="cust-section">
          <div class="cust-label"><span>Base</span><span id="cust-base-note" class="cust-hint">Translucent ice</span></div>
          <div class="seg-toggle" role="group" aria-label="Popsicle base">
            <button type="button" class="seg-btn" data-base="water" aria-pressed="true">Water</button>
            <button type="button" class="seg-btn" data-base="coconut" aria-pressed="false">Milk</button>
          </div>
        </div>

        <div class="cust-section">
          <div class="cust-label"><span>Taste</span><span id="cust-flavor-note" class="cust-hint">1 / 2 max</span></div>
          <div id="cust-flavors" class="chip-grid" role="group" aria-label="Basic tastes (max 2)"></div>
        </div>

        <div class="cust-section">
          <div class="cust-label"><span>Toppings</span><span id="cust-topping-note" class="cust-hint">2 selected</span></div>
          <div id="cust-toppings" class="chip-grid" role="group" aria-label="Toppings"></div>
        </div>
      </div>
      <div id="settings-panel" class="settings-panel" hidden>
        <div class="settings-head">
          <b>Settings</b>
          <div class="settings-actions">
            <button id="btn-settings-copy" class="mini-btn" type="button" title="Copy current settings as JSON">Copy</button>
            <button id="btn-settings-reset" class="mini-btn" type="button" title="Clear saved settings and restore factory defaults">Factory Reset</button>
          </div>
        </div>
        <label class="row"><span>Melt</span><input id="sl-melt" type="range" min="0" max="1" step="0.005" value="0.035" /><output id="val-melt">0.04</output></label>
        <label class="row"><span>Speed</span><input id="sl-speed" type="range" min="0.2" max="6" step="0.1" value="1" /><output id="val-speed">1.0×</output></label>
        <label class="row"><span>Turn</span><input id="sl-turntable" type="range" min="0" max="1" step="0.05" value="0" /><output id="val-turntable">Off</output></label>
        <label class="row"><span>Frost</span><input id="sl-frost" type="range" min="0.1" max="1" step="0.02" value="0.80" /><output id="val-frost">0.80</output></label>
        <label class="row"><span>Bubbles</span><input id="sl-bubbles" type="range" min="0" max="1" step="0.05" value="0.55" /><output id="val-bubbles">0.55</output></label>
        <label class="row row-select"><span>Drops</span><select id="sel-drops"><option value="minimal">Subtle Sweat (Natural)</option><option value="off" selected>Glaze &amp; Pools Only</option><option value="full">Heavy Drops</option></select></label>
        <label class="row row-select"><span>On Fall</span><select id="sel-fall"><option value="pause">Pause Melt</option><option value="slow">Slow-Mo</option><option value="off" selected>Off</option></select></label>
        <details id="drop-debug" class="drop-debug" open>
          <summary>
            <span>Drop Debug</span>
            <button id="btn-drop-reset" class="mini-btn" type="button" title="Reset drop debug defaults">Reset</button>
          </summary>
          <div class="drop-debug-body">
            <label class="row"><span>Teardrop</span><input id="sl-drop-sag" type="range" min="0" max="1.6" step="0.02" value="0.54" /><output id="val-drop-sag">0.54</output></label>
            <label class="row"><span>Stretch</span><input id="sl-drop-stretch" type="range" min="0.85" max="1.8" step="0.02" value="1.51" /><output id="val-drop-stretch">1.51</output></label>
            <label class="row"><span>Edge Blur</span><input id="sl-drop-blur" type="range" min="0" max="1.5" step="0.02" value="1.20" /><output id="val-drop-blur">1.20</output></label>
            <label class="row"><span>Shadow</span><input id="sl-drop-shadow" type="range" min="0" max="1.5" step="0.02" value="0.44" /><output id="val-drop-shadow">0.44</output></label>
            <label class="row"><span>Shd Blur</span><input id="sl-drop-shblur" type="range" min="0.2" max="2.0" step="0.05" value="1.05" /><output id="val-drop-shblur">1.05</output></label>
            <label class="row"><span>Rim Dark</span><input id="sl-drop-rim" type="range" min="0" max="1.5" step="0.02" value="0.48" /><output id="val-drop-rim">0.48</output></label>
            <label class="row"><span>Size</span><input id="sl-drop-size" type="range" min="0.5" max="1.8" step="0.02" value="1.00" /><output id="val-drop-size">1.00</output></label>
            <label class="row"><span>Bot Pool</span><input id="sl-drop-pool" type="range" min="0" max="2.0" step="0.05" value="1.05" /><output id="val-drop-pool">1.05</output></label>
            <label class="row"><span>Bot Drops</span><input id="sl-drop-botcount" type="range" min="0" max="80" step="1" value="10" /><output id="val-drop-botcount">10</output></label>
            <label class="row"><span>Drip Rate</span><input id="sl-drop-drip" type="range" min="0" max="2.0" step="0.05" value="0.76" /><output id="val-drop-drip">0.76</output></label>
          </div>
        </details>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
