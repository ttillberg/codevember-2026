<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e6e3" />
    <title>05 · Moss · Codevember 2026</title>
    <meta name="description" content="Paint five real mosses and lichens onto a rock or a letter" />
    <!-- share image: 05/about/screengrab.png, copied next to the build by scripts/build.mjs -->
    <meta property="og:title" content="05 · Moss · Codevember 2026" />
    <meta property="og:description" content="Paint five real mosses and lichens onto a rock or a letter" />
    <meta property="og:image" content="https://ttillberg.github.io/codevember-2026/05/screengrab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="plate"><div class="head"><b>05 Moss</b><i><a class="home" href="../">Codevember 2026 <span lang="ja">苔</span></a></i></div></div>
    <div class="swatches" role="toolbar" aria-label="brush">
      <button class="sw" data-species="0" aria-label="feather moss, Hylocomium splendens" data-latin="Hylocomium splendens" data-common="glittering wood-moss"><i class="feather"></i><span>feather</span></button>
      <button class="sw" data-species="1" aria-label="star moss, Polytrichum commune" data-latin="Polytrichum commune" data-common="common haircap"><i class="star"></i><span>star</span></button>
      <button class="sw" data-species="3" aria-label="cushion moss, Leucobryum glaucum" data-latin="Leucobryum glaucum" data-common="pincushion moss"><i class="cushion"></i><span>cushion</span></button>
      <button class="sw" data-species="2" aria-label="reindeer lichen, Cladonia rangiferina" data-latin="Cladonia rangiferina" data-common="grey reindeer lichen"><i class="lichen"></i><span>lichen</span></button>
      <button class="sw" data-species="4" aria-label="green reindeer lichen, Cladonia arbuscula" data-latin="Cladonia arbuscula" data-common="green reindeer lichen"><i class="coral"></i><span>coral</span></button>
      <button class="sw" data-species="-1" aria-label="mix of all five" data-latin="Bryophyta et Cladonia" data-common="a bit of everything"><i class="auto"></i><span>mix</span></button>
    </div>
    <button class="letter-btn" aria-haspopup="true" aria-expanded="false" aria-label="choose a letter"><i></i><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="30" /><circle class="fill" cx="32" cy="32" r="30" /></svg></button>
    <div class="letter-pop" role="menu" hidden></div>
    <div class="touch-hint">two fingers to rotate</div>
    <div class="size-ring"></div>
    <button class="scrape-btn" aria-label="scrape" aria-pressed="false" title="scrape (x)"><i class="eraser"></i><span>scrape</span></button>
    <!-- settings: a gear top right, a frosted menu under it (07 Hollow's) -->
    <div class="settings">
      <button class="gear" aria-label="settings" aria-haspopup="true" aria-expanded="false"><svg viewBox="1.4 1.4 13.2 13.2" aria-hidden="true"><path d="M14.35 7.23 L14.33 8.97 L12.53 9.27 L12.02 10.44 L13.03 11.95 L11.78 13.16 L10.31 12.10 L9.12 12.57 L8.77 14.35 L7.03 14.33 L6.73 12.53 L5.56 12.02 L4.05 13.03 L2.84 11.78 L3.90 10.31 L3.43 9.12 L1.65 8.77 L1.67 7.03 L3.47 6.73 L3.98 5.56 L2.97 4.05 L4.22 2.84 L5.69 3.90 L6.88 3.43 L7.23 1.65 L8.97 1.67 L9.27 3.47 L10.44 3.98 L11.95 2.97 L13.16 4.22 L12.10 5.69 L12.57 6.88 Z M10.2 8 A2.2 2.2 0 1 0 5.8 8 A2.2 2.2 0 1 0 10.2 8 Z" fill="currentColor" fill-rule="evenodd" /></svg></button>
      <div class="menu" role="menu" hidden>
        <button class="row" data-uniform="uRim" aria-pressed="true"><span>Back light</span><i class="switch"></i></button>
        <button class="row" data-uniform="uHemi" aria-pressed="true"><span>Sky ambient</span><i class="switch"></i></button>
        <button class="row" data-toggle="ao" aria-pressed="true"><span>Ambient occlusion</span><i class="switch"></i></button>
        <label class="row select"><span>Tone</span><select data-tone>
          <option value="0">NONE</option>
          <option value="1">AGX</option>
          <option value="2" selected>ACES</option>
          <option value="3">NEUTRAL</option>
        </select></label>
        <hr />
        <div class="actions">
          <button data-action="fill"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><path d="M2.5 8a5.5 5.5 0 0 0 11 0z" fill="currentColor" /></svg>Fill everything</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
