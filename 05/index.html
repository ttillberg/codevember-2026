<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 · Moss · Codevember 2026</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <a class="back" href="../">← 05 / Moss</a>
    <div class="swatches" role="toolbar" aria-label="brush">
      <button class="sw" data-species="0" aria-label="feather moss"><i class="feather"></i><span>feather</span></button>
      <button class="sw" data-species="3" aria-label="cushion moss"><i class="cushion"></i><span>cushion</span></button>
      <button class="sw" data-species="1" aria-label="star moss"><i class="star"></i><span>star</span></button>
      <button class="sw" data-species="2" aria-label="reindeer lichen"><i class="lichen"></i><span>lichen</span></button>
      <button class="sw" data-species="-1" aria-label="auto mix"><i class="auto"></i><span>mix</span></button>
    </div>
    <div class="objects" role="toolbar" aria-label="object">
      <button data-object="rock" class="active">rock</button>
      <button data-object="word">M</button>
    </div>
    <label class="scale"><span>moss 175%</span><input type="range" min="50" max="200" value="175" step="5" aria-label="moss size" /></label>
    <div class="size-ring"></div>
    <button class="scrape-btn" aria-label="scrape" aria-pressed="false" title="scrape (x)"><i class="eraser"></i><span>scrape</span></button>
    <div class="hint"><span class="desktop">drag on it to sow moss · 1-5 pick a brush · ⌘-drag for brush size · h hides the rock · shift-drag to scrape · drag outside to orbit</span></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
