<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>02 · Shatter · Codevember 2026</title>
    <meta name="description" content="A wall of frosted 8 mm glass with three targets on it, classic or tempered: shoot it, then swipe, and what is loose blows out as baked rigid shards" />
    <meta name="author" content="Theo Tillberg" />
    <!-- share image: 02/about/screengrab.png, copied next to the build by scripts/build.mjs -->
    <meta property="og:title" content="02 · Shatter · Codevember 2026" />
    <meta property="og:description" content="A wall of frosted 8 mm glass with three targets on it, classic or tempered: shoot it, then swipe, and what is loose blows out as baked rigid shards" />
    <meta property="og:image" content="https://ttillberg.github.io/codevember-2026/02/screengrab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <!-- the title plate (docs/DESIGN.md): put the word in Japanese in the span -->
    <div class="plate"><div class="head"><b>02 Shatter</b><i><a class="home" href="https://ttillberg.github.io/codevember-2026/">Codevember 2026 <span lang="ja">砕ける</span></a> · <a class="home" href="https://x.com/theo_t">@theo_t</a></i></div><p id="hint"></p></div>
    <div id="bake" hidden><i></i><span>Baking the fall</span></div>
    <div id="mode" hidden></div>
    <div id="replay" hidden>
      <button id="rp-play" title="Play / pause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path class="pause" d="M8 5v14M16 5v14" /><path class="play" d="M7 4.5l12 7.5-12 7.5z" /></svg></button>
      <div id="rp-track"><canvas id="rp-chart"></canvas><i id="rp-head"></i></div>
      <button id="rp-speed" title="Speed" aria-label="Speed">0.2×</button>
      <output id="rp-time">0.00 s</output>
    </div>
    <div class="tools">
      <button id="light" title="Light: dark or studio (L)" aria-label="Dark or studio light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8" /></svg></button>
      <button id="glass" title="Glass: classic or tempered (G)" aria-label="Classic or tempered glass"><svg viewBox="0 0 24 24"><path class="x" d="M12 4l2 6 5-2-4 5 3 6-6-4-5 4 2-6-5-4 6 1z" /><path class="on" d="M4 4h16v16H4zM4 9.5h16M4 15h16M9.5 4v16M15 4v16" /></svg></button>
      <button id="tape" title="Tape: drag across the glass, or tap for one straight across (T)" aria-label="Tape"><svg viewBox="0 0 24 24"><path d="M3 15.5l12-9 6 2-12 9z" /><path d="M9 11l6 2" /></svg></button>
      <button id="live" title="Simulation: cached, or live as it is worked out (C)" aria-label="Cached or live simulation"><svg viewBox="0 0 24 24"><path class="on" d="M13 3L5 13.5h6L10 21l8-10.5h-6z" /><path class="x" d="M5 7c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3zM5 7v10c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg></button>
      <button id="film" title="Replay from the side, slowly (S)" aria-label="Replay from the side"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="12" height="12" rx="2" /><path d="M15.5 10.5l5-3v9l-5-3" /></svg></button>
      <button id="again" title="New pane (R)" aria-label="New pane"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 4v4h-4" /></svg></button>
      <button id="sound" title="Sound (M)" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4z" /><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" /><path class="x" d="M16 9l5 6M21 9l-5 6" /></svg></button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
