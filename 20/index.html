    <meta property="og:image" content="https://ttillberg.github.io/codevember-2026/20/screengrab.png" />

  </head>
  <body>
    <canvas id="c"></canvas>
    <canvas class="ref" hidden></canvas>
    <!-- the title plate (docs/DESIGN.md): put the word in Japanese in the span -->
    <div class="plate"><div class="head"><b>20 Cocoon</b><i><a class="home" href="https://ttillberg.github.io/codevember-2026/">Codevember 2026 <span lang="ja">繭</span></a> · <a class="home" href="https://x.com/theo_t">@theo_t</a></i></div></div>
    <!-- the controls, bottom left: bare white symbols, one abstract symbol each: the roof's shutter, the fans' shutters,
         the crane along its rail, the eye (yours, or cutting from shot to shot on its own) (main.ts) -->
    <ul class="controls">
      <li><button data-ctl="roof" aria-label="Roof shutter" title="Roof" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6" /><g class="light"><line x1="12" y1="10" x2="12" y2="17.5" /><line x1="13.9" y1="9.5" x2="17.2" y2="15.7" /><line x1="10.1" y1="9.5" x2="6.8" y2="15.7" /><line x1="15.3" y1="8.2" x2="20.6" y2="11.8" /><line x1="8.7" y1="8.2" x2="3.4" y2="11.8" /></g></svg></button></li>
      <li><button data-ctl="fans-end" aria-label="Fan shutters" title="Fans" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" /><circle class="solid" cx="12" cy="12" r="1.5" /><g class="light blades"><path class="solid" d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(0 12 12)" /><path class="solid" d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(72 12 12)" /><path class="solid" d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(144 12 12)" /><path class="solid" d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(216 12 12)" /><path class="solid" d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(288 12 12)" /></g></svg></button></li>
      <li><button data-ctl="rail" aria-label="Crane along its rail" title="Rail" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6" /><g class="car"><rect class="solid" x="9.5" y="4.2" width="5" height="3.6" rx="0.8" /><line x1="12" y1="8" x2="12" y2="13" /><circle cx="12" cy="16.5" r="3.3" /></g></svg></button></li>
      <li><button data-ctl="eye" aria-label="Camera: yours, or on its own" title="Camera" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" /><circle class="solid mine" cx="12" cy="12" r="1.9" /><path class="solid auto" d="M10.2 8.6 L15.6 12 L10.2 15.4 Z" /><g class="orbit"><circle class="solid" cx="19.5" cy="12" r="2.1" /></g></svg></button></li>
    </ul>
    <!-- debug: a gear bottom right, only with ?settings / ?debug (docs/DESIGN.md) -->
    <div class="debug" hidden>
      <div class="menu" role="menu">
        <div class="head"><span>Debug</span><button class="fold" aria-label="collapse the debug panel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg></button></div>
        <div class="label">View</div>
        <div class="seg" data-group="view">
          <button data-view="front">Front<kbd>1</kbd></button><button data-view="side">Side<kbd>3</kbd></button><button data-view="back">Back<kbd>9</kbd></button><button data-view="persp">Pers<kbd>0</kbd></button>
        </div>
        <div class="label">Projection</div>
        <div class="seg" data-group="proj">
          <button data-proj="ortho">Iso<kbd>5</kbd></button><button data-proj="persp">Pers<kbd>5</kbd></button>
        </div>
        <div class="label">Reference<kbd>R</kbd></div>
        <div class="seg" data-group="ref">
          <button data-ref="off">Off</button><button data-ref="side">Beside</button><button data-ref="down">Below</button>
        </div>
        <div class="seg">
          <button data-still>Hold still<kbd>H</kbd></button>
        </div>
        <div class="seg">
          <button data-ao>SSAO<kbd>O</kbd></button><button data-shade>AO map<kbd>M</kbd></button>
        </div>
        <div class="label">Rays, steps</div>
        <div class="seg" data-group="steps">
          <button data-steps="24">24</button><button data-steps="32">32</button><button data-steps="40">40</button>
        </div>
        <div class="label">Hall steel</div>
        <div class="seg" data-group="steel">
          <button data-steel="grit">Grit</button><button data-steel="plain">Plain</button><button data-steel="off">Off</button>
        </div>
        <div class="seg">
          <button data-blood>Blood</button><button data-copy>Copy view<kbd>C</kbd></button>
        </div>
        <div class="readout"></div>
      </div>
      <button class="gear" aria-label="expand the debug panel" aria-expanded="true" hidden><svg viewBox="1.4 1.4 13.2 13.2" aria-hidden="true"><path d="M14.35 7.23 L14.33 8.97 L12.53 9.27 L12.02 10.44 L13.03 11.95 L11.78 13.16 L10.31 12.10 L9.12 12.57 L8.77 14.35 L7.03 14.33 L6.73 12.53 L5.56 12.02 L4.05 13.03 L2.84 11.78 L3.90 10.31 L3.43 9.12 L1.65 8.77 L1.67 7.03 L3.47 6.73 L3.98 5.56 L2.97 4.05 L4.22 2.84 L5.69 3.90 L6.88 3.43 L7.23 1.65 L8.97 1.67 L9.27 3.47 L10.44 3.98 L11.95 2.97 L13.16 4.22 L12.10 5.69 L12.57 6.88 Z M10.2 8 A2.2 2.2 0 1 0 5.8 8 A2.2 2.2 0 1 0 10.2 8 Z" fill="currentColor" fill-rule="evenodd" /></svg></button>
    </div>
    <!-- black over it all until the scene is loaded and drawn, then it fades in (main.ts) -->
    <!-- black until the scene is loaded and drawn, a fan turning in it meanwhile; the title plate stays over it (main.ts) -->
    <div class="fade"><svg class="loader" viewBox="0 0 24 24" role="img" aria-label="Loading"><circle class="ring" cx="12" cy="12" r="8.6" /><circle cx="12" cy="12" r="1.5" /><g class="turn"><path d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(0 12 12)" /><path d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(72 12 12)" /><path d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(144 12 12)" /><path d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(216 12 12)" /><path d="M12 10.4 C14.2 9.6 15.6 7.6 14.6 5 C12.4 5.2 11 7.2 12 10.4 Z" transform="rotate(288 12 12)" /></g></svg></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
