<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>16 · Spore · Codevember 2026</title>
    <meta name="description" content="Crawl over an endless moss carpet at dusk with a worm's eye and throw spores: mushrooms grow in timelapse" />
    <meta name="author" content="Theo Tillberg" />
    <!-- share image: 16/about/screengrab.png, copied next to the build by scripts/build.mjs -->
    <meta property="og:title" content="16 · Spore · Codevember 2026" />
    <meta property="og:description" content="Crawl over an endless moss carpet at dusk with a worm's eye and throw spores: mushrooms grow in timelapse" />
    <meta property="og:image" content="https://ttillberg.github.io/codevember-2026/16/screengrab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="loading">
    <canvas id="c"></canvas>
    <!-- loading (as day 12): the splash, a card in the middle, over the forest drawn as a golden wire mesh; the picture fades in over the mesh once ready -->
    <div class="splash"><img src="splash.webp" alt="16 Spores: a gnome with a slingshot among fly agarics in a sunlit birch wood" fetchpriority="high" /></div>
    <!-- the title plate (docs/DESIGN.md): put the word in Japanese in the span -->
    <div class="plate"><div class="head"><b>16 Spore</b><i><a class="home" href="https://ttillberg.github.io/codevember-2026/">Codevember 2026 <span lang="ja">胞子</span></a> · <a class="home" href="https://x.com/theo_t">@theo_t</a></i></div><div class="sub"><span class="touchonly">Drag to look · hold to crawl, low down to back up · tap to sow spores · flick up to fling them</span></div></div>
    <div class="target"><i></i></div>
    <!-- desktop: the keys, bottom left, thin outlined caps (08's .key); none on a phone -->
    <div class="keymap" aria-label="Keys">
      <span><i class="wasd"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></i><em>crawl</em></span>
      <span><kbd class="wide">Shift</kbd>run</span>
      <span><kbd>C</kbd>crouch</span>
      <span><kbd class="wide">Space</kbd>jump</span>
      <span><kbd class="wide">Click</kbd>sow</span>
      <span><kbd>F</kbd>fungarium</span>
      <span><kbd>M</kbd>mute</span>
    </div>
    <!-- top right: sound on or off (left of the gyro on a phone) -->
    <button class="mute" type="button" aria-label="Mute" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /><path class="off" d="M16 9.5l5 5M21 9.5l-5 5" /></svg></button>
    <button class="gyro" type="button" aria-label="Turn the phone to look around" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3.5" width="8" height="17" rx="2" transform="rotate(-18 12 12)" /><path d="M3 8.5a10 10 0 0 0 0 7M21 8.5a10 10 0 0 1 0 7" /></svg></button>
    <!-- desktop: lock the pointer and the mouse itself is the look, as in a shooter (the pill from day 08) -->
    <button class="lockpill" type="button"><svg width="14" height="14" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M11 1.5v5M11 15.5v5M1.5 11h5M15.5 11h5" /><circle cx="11" cy="11" r="1.1" fill="currentColor" stroke="none" /></svg>Lock pointer</button>
    <div class="unlock"><kbd>Esc</kbd>to unlock</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
